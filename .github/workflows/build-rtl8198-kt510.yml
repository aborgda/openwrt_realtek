name: Build RTL8198 KT510

on:
  push:
    branches: ["kt510-rtl8198"]
  workflow_dispatch:
  pull_request:

jobs:
  host-tools:
    timeout-minutes: 25
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils rsync unzip file wget git
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
      - name: Configure host tools
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198=y
          CONFIG_TARGET_BOARD="realtek"
          CONFIG_TARGET_ARCH_PACKAGES="realtek_lx53"
          CONFIG_CPU_TYPE="lx53"
          CONFIG_TARGET_OPTIMIZATION="-Os -pipe -fno-caller-saves -fno-plt -fhonour-copts"
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_swconfig=y
          EOF
          make FORCE=1 defconfig
      - name: Build host tools
        run: make FORCE=1 -j8 V=s tools/install
      - name: Save OpenWrt host tools
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/host
            build_dir/host
          key: rtl8198-host-${{ runner.os }}-${{ hashFiles('tools/Makefile', 'include/version.mk') }}

  build-kt510:
    needs: host-tools
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    env:
      MAKEFLAGS: -j8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext             libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils             rsync unzip file wget git
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

      - name: Cache OpenWrt host tools
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/host
            build_dir/host
          key: rtl8198-host-${{ runner.os }}-${{ hashFiles('tools/Makefile', 'include/version.mk') }}
      - name: Prepare minimal build
        run: |
          rm -rf feeds
          mkdir -p feeds
      - name: Configure KT510
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek=y
          CONFIG_TARGET_realtek_rtl8198=y
          CONFIG_TARGET_BOARD="realtek"
          CONFIG_TARGET_ARCH_PACKAGES="realtek_lx53"
          CONFIG_CPU_TYPE="lx53"
          CONFIG_TARGET_OPTIMIZATION="-Os -pipe -fno-caller-saves -fno-plt -fhonour-copts"
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_swconfig=y
          EOF
          make FORCE=1 defconfig
          grep -E '^(CONFIG_TARGET_realtek|CONFIG_TARGET_realtek_rtl8198|CONFIG_CPU_TYPE|CONFIG_TARGET_ARCH_PACKAGES|CONFIG_SOC_RTL8198)=' .config

      - name: Build RTL8198 kernel and image
        run: |
          timeout 5m make -j1 V=s tools/m4/prepare
          python3 - <<'PY'
          p = "build_dir/host/m4-1.4.18/lib/c-stack.c"
          s = open(p).read()
          start = s.index("#ifndef SIGSTKSZ")
          end = s.index("#endif", start) + len("#endif")
          s = s[:start] + "#undef SIGSTKSZ\n#define SIGSTKSZ 16384" + s[end:]
          open(p, "w").write(s)
          PY
          # Old binutils 2.34 runs host configure tests that can hang on modern runners.
          # These are the known non-null malloc/realloc probes; cache them for the host build.
          export ac_cv_func_malloc_0_nonnull=yes
          export ac_cv_func_realloc_0_nonnull=yes
          timeout 10m make -j1 V=s tools/install
          timeout 15m make -j1 V=s toolchain/install
          timeout 10m make FORCE=1 -j8 V=s target/linux/compile
          timeout 10m make FORCE=1 -j8 V=s target/linux/install
          timeout 10m make FORCE=1 -j8 V=s target/linux/image/compile

      - name: Verify KT510 image
        run: |
          find bin/targets/realtek/rtl8198 -maxdepth 2 -type f -print
          test -n "$(find bin/targets/realtek/rtl8198 -type f -name '*KT510*' -o -name 'factory.bin' | head -1)"

      - name: Upload KT510 images
        uses: actions/upload-artifact@v4
        with:
          name: kt510-rtl8198
          path: bin/targets/realtek/rtl8198/*
          if-no-files-found: error

