name: Build RTL8198C SK337 and GN866 AC

on:
  push:
    branches: ["sk337-gn866-rtl8198c"]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout board overlay
        uses: actions/checkout@v4

      - name: Build on known RTL8198C OpenWrt base
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch 8198c https://github.com/plappermaul/openwrt.git openwrt
          cp board-overlay/rtl8198c_SK337.dts openwrt/target/linux/realtek/dts-5.10/
          cp board-overlay/rtl8198c_GN866.dts openwrt/target/linux/realtek/dts-5.10/
          mkdir -p openwrt/files/etc/config openwrt/files/etc/uci-defaults
          cp board-overlay/etc/config/wireless openwrt/files/etc/config/wireless
          cp board-overlay/etc/uci-defaults/99-sk337-gn866-wlan openwrt/files/etc/uci-defaults/99-sk337-gn866-wlan
          chmod +x openwrt/files/etc/uci-defaults/99-sk337-gn866-wlan
          cat board-overlay/rtl8198c-boards.mk >> openwrt/target/linux/realtek/image/rtl8198c.mk
          sed -i 's/# TARGET_DEVICES += f-secure_sense/TARGET_DEVICES += f-secure_sense/' openwrt/target/linux/realtek/image/rtl8198c.mk || true
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          grep -q 'TARGET_DEVICES += sk337' target/linux/realtek/image/rtl8198c.mk
          grep -q 'TARGET_DEVICES += gn866_ac' target/linux/realtek/image/rtl8198c.mk
          cat > .config <<'EOF
CONFIG_TARGET_realtek=y
CONFIG_TARGET_realtek_rtl8198c=y
CONFIG_TARGET_BOARD="realtek"
CONFIG_PACKAGE_kmod-mac80211=y
CONFIG_PACKAGE_wpad-basic-mbedtls=y
CONFIG_PACKAGE_uci=y
CONFIG_PACKAGE_netifd=y
EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_realtek|CONFIG_TARGET_realtek_rtl8198c|CONFIG_CPU_TYPE|CONFIG_TARGET_ARCH_PACKAGES)=' .config
          make -j2 target/linux/compile
          make -j2 target/linux/install
          make -j2 target/linux/image/compile

      - name: Collect images
        uses: actions/upload-artifact@v4
        with:
          name: rtl8198c-sk337-gn866
          path: |
            openwrt/bin/targets/realtek/rtl8198c/*
            openwrt/bin/targets/realtek/rtl8198c/**/*SK337*
            openwrt/bin/targets/realtek/rtl8198c/**/*GN866*
          if-no-files-found: warn

  kt510-validation:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate KT510 board definition
        shell: bash
        run: |
          set -euxo pipefail
          test -f target/linux/realtek/rtl8198/profiles/00-Default.mk
          grep -q 'Profile/KT510' target/linux/realtek/rtl8198/profiles/00-Default.mk
          grep -q 'RTL8198 + RTL8192ER + RTL8812AR' target/linux/realtek/rtl8198/profiles/00-Default.mk
          grep -q '16 MiB' target/linux/realtek/rtl8198/profiles/00-Default.mk
          test -f board-overlay/KT510_DUMP_NOTES.md
          echo "KT510 profile/metadata validation passed."
          echo "A factory KT510 image is intentionally not generated until a verified RTL8198 BSP/loader/header is available."
